# yaml-language-server: $schema=https://schemas.examplary.ai/question-type.json

id: examplary.expansion.matching
public: true
isDefault: true

name:
  en: Matching
  nl: Combinaties
description:
  en: Match the correct items with their pairs from two lists.
  nl: Koppel de juiste items aan hun tegenhangers uit twee lijsten.

icon: ./icon.svg
components:
  assessment: ./component-assessment.tsx
  print: ./component-print.tsx
  results: ./component-results.tsx
  settings-area: ./component-settings-area.tsx

generation:
  enabled: true
  instructions: |
    Generate settings that look like this: 
    {
      "left": ["Apple", "Banana", "Grapes"],
      "right": ["Red", "Yellow", "Purple"],
      "correctAnswer": ["Apple = Red", "Banana = Yellow", "Grapes = Purple"],
      "layout": "vertical",
      "shuffle": false
    }

    Generate between 2 and 5 pairs. Do not include any other fields. Make sure that the left and right arrays contain unique items, and that the correctAnswer 
    array contains pairs that EXACTLY match the items in the left and right arrays.

scanning:
  instructions: |
    The answer should be an array of strings, in the format of ["Apple = Red", "Banana = Yellow", "Grapes = Purple"].
    Each string should contain exactly one ` = `. If there are multiple ` = ` in a string, only the first one will be used as the separator between left and right.
    If an answer is close to one of the pairs in the `correctAnswer` setting, copy over the pair from the settings, eg. if the answer is "Apple = red", it should be changed to "Apple = Red".
    ONLY DO THIS IF THE ANSWER IS VERY CLOSE TO THE PAIR IN THE SETTINGS, OTHERWISE LEAVE THE ANSWER AS IS. The order of the pairs in the answer does not matter.

    The student might also use numbers and letters, referring to the printed sheet. The number represents an item from the `left` setting ("1" is the first item). The letter
    represents an item from the `right` setting; on the printed sheet these are sorted alphabetically unless the shuffle setting is enabled, so "A" is the alphabetically first
    item (e.g. with right items ["Red", "Yellow", "Purple"], "1 = A" means the first left item matched with "Purple"). In that case, convert the numbers and letters to the
    corresponding items from the settings. In which case, make sure to copy over all formatting, including <p> tags etc. from the original left/right options.
    ONLY DO THIS IF THE ANSWER IS IN THE FORMAT OF NUMBERS AND LETTERS THAT CORRESPOND TO THE OPTIONS, OTHERWISE LEAVE IT AS IS.

timeEstimateMinutes: 2
hasSimpleScoring: true

settings:
  - id: left
    type: string-array
    name: Left items
    description: 'Array containing the items shown in the left column (or top row). Example: `["Apple", "Banana"]`.'
    hidden: true
    required: true

  - id: right
    type: string-array
    name: Right items
    description: 'Array containing the answer options the student can match with, shown in the right column (or bottom row). Example: `["Red", "Yellow"]`.'
    hidden: true
    required: true

  - id: correctAnswer
    type: string-array
    name: Correct answer
    description: 'Array containing the correct pairs, where each pair is a string that contains ` = `. The text left of the ` = ` must exactly match an item from `left`, the text right of it an item from `right`. Example: `["Apple = Red", "Banana = Yellow"]`.'
    hidden: true
    required: true

  - id: layout
    type: enum
    name:
      en: Layout
      nl: Layout
    description: The layout to use for displaying the matching question. `vertical` displays the items in two vertical columns, while `horizontal` displays them in two horizontal rows. Don't use horizontal if there are more than 3 items.
    options:
      - value: vertical
        label:
          en: Vertical
          nl: Verticaal
      - value: horizontal
        label:
          en: Horizontal
          nl: Horizontaal
    default: vertical

  - id: shuffle
    type: boolean
    name:
      en: Shuffle options
      nl: Willekeurige volgorde
    description: Whether to show the options in a random order to the student. If disabled, the answer options are shown in alphabetical order.
    default: false

responseProcessing:
  condition: |
    =$join($sort($.answer.value), '|') = $join($sort($exists($.question.settings.correctAnswer) ? $.question.settings.correctAnswer : $.question.settings.pairs), '|')
  testCases:
    - question:
        {
          settings:
            {
              left: ["Apple", "Banana", "Grapes"],
              right: ["Red", "Yellow", "Purple"],
              correctAnswer:
                ["Apple = Red", "Banana = Yellow", "Grapes = Purple"],
            },
        }
      answer: { value: ["Apple = Red", "Banana = Yellow", "Grapes = Purple"] }
      expectedOutcome: true
    - question:
        {
          settings:
            {
              left: ["Apple", "Banana", "Grapes"],
              right: ["Red", "Yellow", "Purple"],
              correctAnswer:
                ["Apple = Red", "Banana = Yellow", "Grapes = Purple"],
            },
        }
      answer: { value: ["Grapes = Purple", "Apple = Red", "Banana = Yellow"] }
      expectedOutcome: true
    - question:
        {
          settings:
            {
              left: ["Apple", "Banana", "Grapes"],
              right: ["Red", "Yellow", "Purple"],
              correctAnswer:
                ["Apple = Red", "Banana = Yellow", "Grapes = Purple"],
            },
        }
      answer: { value: ["Apple = Yellow", "Banana = Red", "Grapes = Purple"] }
      expectedOutcome: false
    - question:
        {
          settings:
            {
              left: ["Apple", "Banana", "Grapes"],
              right: ["Red", "Yellow", "Purple"],
              correctAnswer:
                ["Apple = Red", "Banana = Yellow", "Grapes = Purple"],
            },
        }
      answer: { value: ["Apple = Red", "Banana = Yellow"] }
      expectedOutcome: false
    # Questions created before the left/right/correctAnswer settings only
    # have a legacy `pairs` setting, which is still supported:
    - question:
        {
          settings:
            { pairs: ["Apple = Red", "Banana = Yellow", "Grapes = Purple"] },
        }
      answer: { value: ["Grapes = Purple", "Apple = Red", "Banana = Yellow"] }
      expectedOutcome: true

translations:
  pairs:
    en: Pairs
    nl: Paren
  left-column:
    en: Left column
    nl: Linker kolom
  right-column:
    en: Right column
    nl: Rechter kolom
  top-row:
    en: Top row
    nl: Bovenste rij
  bottom-row:
    en: Bottom row
    nl: Onderste rij
  help-vertical:
    en: Add the correct combinations. The student will see the left column items, and must match them with the right column items.
    nl: Voeg de juiste combinaties toe. De leerling ziet de items in de linker kolom en moet ze koppelen aan de items in de rechter kolom.
  help-horizontal:
    en: Add the correct combinations. The student will see the top row items, and must match them with the bottom row items.
    nl: Voeg de juiste combinaties toe. De leerling ziet de items in de bovenste rij en moet ze koppelen aan de items in de onderste rij.
  placeholder-item:
    en: Shown item...
    nl: Getoond item...
  placeholder-answer:
    en: Add an item...
    nl: Voeg een item toe...
  drag-options:
    en: Drag these items to the correct matches.
    nl: Sleep deze items naar de juiste combinaties.
  possible-answers:
    en: "Possible answers:"
    nl: "Mogelijke antwoorden:"
